<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحقق من محضر الاجتماع | شركة إس تراديكس</title>
<style>
  body {
    font-family: "Cairo", sans-serif;
    background: #ffffff;
    color: #1e293b;
    margin: 0;
    padding: 0;
  }

  .container {
    max-width: 600px;
    margin: 80px auto;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    padding: 30px;
    text-align: center;
  }

  /* دائرة التحميل */
  .loader {
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 6px solid rgba(16, 185, 129, 0.2);
    border-top: 6px solid #10b981;
    animation: spin 1.5s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* دائرة التحقق */
.verified-icon {
  width: 100px;
  height: 100px;
  margin: 0 auto 20px;
  background: #10b981;
  color: #ffffff !important;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  box-shadow: 0 0 25px rgba(16,185,129,0.6);
  -webkit-text-fill-color: #ffffff !important; /* لإجبار الأبيض في Safari */
  -webkit-text-stroke: 0px transparent; /* منع أي تظليل تلقائي */
  text-shadow: 0 0 2px rgba(255,255,255,0.8); /* تثبيت اللون الأبيض */
}

  h2 {
    color: #0f172a;
    margin-bottom: 10px;
  }

  .details {
    display: none;
    text-align: right;
    background: #ffffff;
    padding: 15px;
    border-radius: 10px;
    line-height: 1.8;
    border: 1px solid #e5e7eb;
    font-size: 16px;
  }

  .footer {
    margin-top: 20px;
    font-size: 14px;
    color: #475569;
    border-top: 1px solid #e2e8f0;
    padding-top: 10px;
  }

  .verified-text {
    font-size: 22px;
    font-weight: 700;
    color: #059669;
    margin-top: 10px;
    display: none;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="container">
  <div id="loader" class="loader"></div>
<div id="verifiedIcon" class="verified-icon">
  <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10" stroke="none" fill="none"></circle>
    <path d="M20 6L9 17l-5-5" />
  </svg>
</div>
  <h2 id="title">جاري التحقق من التوثيق...</h2>
  <div class="verified-text" id="verifiedText">تم التحقق بنجاح</div>
  <div class="details" id="meetingDetails"></div>
  <div class="footer">
    🔒 هذا التأكيد صادر رسميًا من شركة إس تراديكس، ويُعد إثباتًا لصحة البيانات المعروضة.
  </div>
</div>

<script>
  // استخراج المتغيرات من عنوان الصفحة
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code") || "";
  const company = (params.get("company") || "غير محدد");
  const date = params.get("date") || "غير محدد";
  const place = (params.get("place") || "غير محدد");
  const beneficiary = (params.get("beneficiary") || "غير محدد");
  const subject = (params.get("subject") || "غير محدد");


  // بعد ثانيتين - عرض علامة التحقق
  setTimeout(() => {
    document.getElementById("loader").style.display = "none";
    document.getElementById("verifiedIcon").style.display = "flex";
    document.getElementById("verifiedText").style.display = "block";
    document.getElementById("title").textContent = "تم التحقق من التوثيق";
    document.getElementById("meetingDetails").style.display = "block";

    // عرض تفاصيل الاجتماع
    // Build details with textContent so URL parameters can never inject HTML/script (XSS fix)
    const details = document.getElementById("meetingDetails");
    details.replaceChildren();
    [["اسم الشركة", company], ["تاريخ المستند", date], ["مكان التوثيق", place], ["رقم التوثيق", code], ["المستفيد", beneficiary], ["الموضوع", subject]]
      .forEach(([label, value]) => {
        const p = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = label + ":";
        p.append(strong, " " + String(value).slice(0, 300));
        details.append(p);
      });
  }, 2000);
</script>

</body>
</html>
