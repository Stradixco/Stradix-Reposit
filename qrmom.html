<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <script type="module" src="js/portal-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR توثيق العقود | STRADIX Company</title>

  <!-- ✅ Header and sidebar -->
  <link rel="stylesheet" href="../background-header/Header-style.css" />
  <script src="../background-header/load-header.js" defer></script>
  <link rel="stylesheet" href="sidebar-style.css" />
  <script src="load-sidebar.js" defer></script>

<style>
  body {
  margin: 0;
  padding: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0a0f1c, #0c1b2a);
  color: #e7ecf7;
}

/* يخلي الصفحة تبدأ بعد الهيدر */
.main-content {
  margin-top: 100px; /* ارتفاع الهيدر */
  margin-right: 300px; /* مساحة للسايد بار */
  padding: 20px;
}
  .container {
    max-width: 1200px;
    margin: auto;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center;
    color: #9ecbff;
    margin-bottom: 30px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(255,255,255,0.07);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px;
    text-align: center;
  }
  th {
    background: rgba(255,255,255,0.1);
  }
  tr:hover { background: rgba(255,255,255,0.05); }
  button {
    border: none;
    border-radius: 6px;
    cursor: pointer;
    padding: 6px 12px;
    font-weight: bold;
  }
  .add-btn {
    margin-top: 15px;
    background: #2563eb;
    color: white;
  }
  .edit-btn { background: #f59e0b; color: white; }
  .del-btn { background: #dc2626; color: white; }
  .qr-btn { background: #10b981; color: white; }
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
  }
  .modal-content {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    width: 320px;
  }
  label { display: block; margin-bottom: 8px; }
  select, input {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: none;
    background: #0f172a;
    color: #e7ecf7;
  }
  .close-btn {
    background: #475569;
    margin-top: 10px;
    color: white;
    width: 100%;
  }
</style>
</head>
<body>

<div class="main-content">
  <div class="container">
  <h1>📘 محاضر اجتماعات مجلس الإدارة</h1>
<table id="momTable" border="1" style="width:100%; text-align:center;">
  <thead>
    <tr>
      <th>م</th>
      <th>كود مختصر</th>
      <th>اسم الشركة</th>
      <th>تاريخ الاجتماع</th>
      <th>مكان الاجتماع</th>
      <th>المستفيد</th>
      <th>الموضوع</th>
      <th>الخيارات</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<button onclick="addRow()">➕ إضافة صف جديد</button>
</div>

<!-- نافذة التعديل -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>تعديل بيانات المحضر</h3>
    <label>تاريخ الاجتماع:</label>
    <input type="date" id="editDate">
    <label>مكان الاجتماع:</label>
    <select id="editPlace">
      <option>الدمام</option>
      <option>الخبر</option>
      <option>الرياض</option>
      <option>جدة</option>
      <option>القاهرة</option>
      <option>الإسكندرية</option>
    </select>
    <button class="add-btn" onclick="saveEdit()">💾 حفظ</button>
    <button class="close-btn" onclick="closeModal()">إغلاق</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
let table = document.getElementById("momTable").querySelector("tbody");
let editIndex = null;

function addRow() {
  const table = document.getElementById("momTable").getElementsByTagName('tbody')[0];
  const rowCount = table.rows.length;
  const row = table.insertRow(rowCount);

  row.innerHTML = `
    <td>${rowCount + 1}</td>
    <td><input type="text" class="code-input" placeholder="اكتب الكود هنا..." /></td>
    <td>شركة إس تراديكس - سجل تجاري 7052015091</td>
    <td><input type="date" class="meeting-date" /></td>
    <td>
      <select class="meeting-place">
        <option value="">اختر المكان</option>
        <option value="الدمام">الدمام</option>
        <option value="الخبر">الخبر</option>
        <option value="الرياض">الرياض</option>
        <option value="جدة">جدة</option>
        <option value="القاهرة">القاهرة</option>
        <option value="الإسكندرية">الإسكندرية</option>
      </select>
    </td>
    <td><input type="text" class="meeting-beneficiary" placeholder="اسم المستفيد" /></td>
    <td><input type="text" class="meeting-subject" placeholder="موضوع الاجتماع" /></td>
    <td>
      <button class="delete-btn" onclick="deleteRow(this)">🗑️</button>
      <button class="qr-btn" onclick="generateQR(this)">📱 QR</button>
    </td>
  `;
}

function deleteRow(btn) {
  btn.closest("tr").remove();
  [...table.rows].forEach((r, i) => r.cells[0].textContent = i + 1);
}

function generateQR(btn) {
  const row = btn.closest('tr');
  const code = row.querySelector('.code-input').value.trim();
  const company = encodeURIComponent(row.cells[2].innerText);
  const date = row.querySelector('.meeting-date').value;
  const place = encodeURIComponent(row.querySelector('.meeting-place').value);
  const beneficiary = encodeURIComponent(row.querySelector('.meeting-beneficiary').value);
  const subject = encodeURIComponent(row.querySelector('.meeting-subject').value);

  if (!code || !date || !place) {
    alert("يرجى إدخال الكود والتاريخ والمكان قبل إنشاء QR.");
    return;
  }

  // إنشاء رابط التحقق الصحيح
  const qrUrl = `https://www.s-tradix.com/verify.html?code=${code}&company=${company}&date=${date}&place=${place}&beneficiary=${beneficiary}&subject=${subject}`;

  // توليد صورة الكيو آر وتحميلها
  const qrDiv = document.createElement("div");
  new QRCode(qrDiv, { text: qrUrl, width: 200, height: 200 });

  // تأخير بسيط حتى يتم إنشاء الـ Canvas
  setTimeout(() => {
    const canvas = qrDiv.querySelector("canvas");
    if (canvas) {
      const a = document.createElement("a");
      a.download = `${code}.png`;
      a.href = canvas.toDataURL("image/png");
      a.click();
    } else {
      alert("حدث خطأ أثناء توليد الكيو آر.");
    }
  }, 500);
}
</script>
</body>

  <div id="header"></div>
  <div id="sidebar-container"></div>

</html>
