<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <script type="module" src="js/portal-guard.js"></script>
  
  <title>📁 قائمة الفواتير</title>
  <!-- ✅ Header and sidebar -->
  <link rel="stylesheet" href="../background-header/Header-style.css" />
  <script src="../background-header/load-header.js" defer></script>
  <link rel="stylesheet" href="sidebar-style.css" />
  <script src="load-sidebar.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/portal.css?v=1">
</head>
<body class="portal pg-invoices">

  <!-- Header & Sidebar -->
  <div id="header"></div>
<div id="sidebar-container"></div>

  <div class="main">
    <div class="page-inner">
      <div class="page-head">
        <div>
          <span class="eyebrow">الفواتير</span>
          <h1>Invoice List</h1>
          <p>ابحث وافرز واعرض كل الفواتير المحفوظة.</p>
        </div>
        <div class="page-actions btns">
          <button class="btn-secondary" onclick="goToCreditNote()">+ Credit Note</button>
          <button class="btn-primary" onclick="goToAddInvoice()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> إنشاء فاتورة</button>
        </div>
      </div>

      <div class="top-controls">
        <input type="text" id="searchInput" placeholder="Search by Invoice Number or Customer name..." />
      </div>

      <div class="table-wrap">
        <table id="invoiceTable">
          <thead>
            <tr>
              <th onclick="sortTable('invoiceNumber')">Invoice Number ⇅</th>
              <th onclick="sortTable('clientName')">Customer Name ⇅</th>
              <th onclick="sortTable('invoiceDate')">Invoice Date ⇅</th>
              <th onclick="sortTable('totalAmount')">Total ⇅</th>
              <th>To do</th>
            </tr>
          </thead>
          <tbody id="invoiceBody">
            <!-- سيتم ملء الصفوف من الجافاسكريبت -->
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination">
        <!-- أزرار الصفحات -->
      </div>
    </div>
  </div>

  <script>
    let invoices = JSON.parse(localStorage.getItem("invoices")) || [];
    let currentPage = 1;
    const rowsPerPage = 30;

    function renderTable(data = invoices) {
      const start = (currentPage - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const pageData = data.slice(start, end);

      const tbody = document.getElementById("invoiceBody");
      tbody.innerHTML = "";

      pageData.forEach(inv => {
        const row = `
          <tr>
            <td>${inv.invoiceNumber}</td>
            <td>${inv.clientName}</td>
            <td>${inv.invoiceDate}</td>
            <td>${inv.totalAmount}</td>
            <td><button class="action-button" onclick="viewInvoice('${inv.invoiceNumber}')">👁️ عرض</button></td>
          </tr>
        `;
        tbody.innerHTML += row;
      });

      renderPagination(data.length);
    }

    function renderPagination(totalRows) {
      const totalPages = Math.ceil(totalRows / rowsPerPage);
      const pagination = document.getElementById("pagination");
      pagination.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.className = i === currentPage ? "active" : "";
        btn.onclick = () => {
          currentPage = i;
          renderTable();
        };
        pagination.appendChild(btn);
      }
    }

    function viewInvoice(invoiceNumber) {
      localStorage.setItem("selectedInvoice", invoiceNumber);
      window.location.href = "invoice-view.html";
    }

    function goToCreditNote() {
      window.location.href = "Credit-note.html";
    }

    function goToAddInvoice() {
      window.location.href = "add-invoice.html";
    }

    function sortTable(field) {
      invoices.sort((a, b) => {
        if (a[field] < b[field]) return -1;
        if (a[field] > b[field]) return 1;
        return 0;
      });
      renderTable();
    }

    document.getElementById("searchInput").addEventListener("input", function () {
      const query = this.value.toLowerCase();
      const filtered = invoices.filter(inv =>
        inv.invoiceNumber.toLowerCase().includes(query) ||
        inv.clientName.toLowerCase().includes(query) ||
        inv.invoiceDate.toLowerCase().includes(query)
      );
      currentPage = 1;
      renderTable(filtered);
    });

    // أول تحميل
    renderTable();
  </script>
</body>
</html>
