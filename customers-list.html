<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <script type="module" src="js/portal-guard.js"></script>
  <title>📋 قائمة العملاء</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ Header and sidebar -->
  <link rel="stylesheet" href="../background-header/Header-style.css" />
  <script src="../background-header/load-header.js" defer></script>
  <link rel="stylesheet" href="sidebar-style.css" />
  <script src="load-sidebar.js" defer></script>
  <link rel="stylesheet" href="assets/css/portal.css?v=1">
</head>
<body class="portal pg-customers">

<!-- Header & Sidebar -->
<script src="./background-header/load-header.js" defer></script>
<div id="header"></div>
<div id="sidebar-container"></div>

<div class="main">
  <div class="page-inner">
    <div class="page-head">
      <div>
        <span class="eyebrow">العملاء</span>
        <h1>قائمة العملاء</h1>
        <p>إدارة بيانات العملاء المستخدمة في الاتفاقيات والفواتير.</p>
      </div>
      <div class="page-actions">
        <button class="btn-export" onclick="exportToExcel()">تصدير Excel</button>
        <button class="btn-create" onclick="window.location.href='Customer-Create.html'"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> إنشاء عميل</button>
      </div>
    </div>

    <div class="controls">
      <div class="search-pair">
        <input type="text" id="searchByName" placeholder="ابحث بالاسم">
        <input type="text" id="searchById" placeholder="ابحث برقم العميل">
      </div>
      <button class="btn-delete" onclick="deleteSelected()">🗑️ حذف المحدد</button>
    </div>

    <div class="table-wrap">
      <table id="customersTable">
        <thead>
          <tr>
            <th>Client ID</th>
            <th>Name</th>
            <th>CR Number</th>
            <th>Address</th>
            <th>VAT #</th>
            <th>تعديل</th>
            <th>حذف</th>
          </tr>
        </thead>
        <tbody id="customerTableBody">
          <!-- سيتم ملء البيانات تلقائيًا -->
        </tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<script src="sidebar/load-sidebar.js"></script>

<script>
async function loadCustomers() {
  try {
    const res = await fetch("https://agreement-generator-kfsp.onrender.com/customers.json");
    const data = await res.json();
    const tbody = document.getElementById("customerTableBody");
    tbody.innerHTML = "";

    data.forEach((customer, index) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${customer.client_id || "-"}</td>
        <td>${customer.client_name_en || "-"}</td>
        <td>${customer.client_cr || "-"}</td>
        <td>${customer.client_address_en || "-"}</td>
        <td>${customer.client_vat || "-"}</td>
        <td><button class="btn edit-btn" onclick="editCustomer('${customer.client_id}')">✏️</button></td>
        <td><button class="btn delete-btn" onclick="deleteCustomer('${customer.client_id}')">🗑️</button></td>
      `;
      tbody.appendChild(row);
    });
  } catch (error) {
    console.error("فشل تحميل العملاء:", error);
  }
}

function editCustomer(clientId) {
  window.location.href = `Customer-Edit.html?client_id=${clientId}`;
}




async function deleteCustomer(clientId) {
  if (!confirm("هل تريد حذف هذا العميل؟")) return;

  try {
    const res = await fetch("https://agreement-generator-kfsp.onrender.com/delete-customer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ client_id: clientId })
    });

    if (res.ok) {
      alert("✅ تم حذف العميل بنجاح");
      loadCustomers();
    } else {
      alert("❌ فشل في حذف العميل");
    }
  } catch (error) {
    console.error("❌ خطأ أثناء الحذف:", error);
    alert("❌ حدث خطأ في الاتصال بالسيرفر");
  }
}
</script>

</body>
</html>
