<body>


 <!-- ✅ محتوى الصفحة -->
  <div class="main">
    <div class="workspace page-inner">
<div class="page-head">
        <div>
          <span class="eyebrow">فاتورة ضريبية · Tradix</span>
          <h1>صفحة الفاتورة</h1>
          <p>أنشئ رمز QR للفاتورة الضريبية وفق متطلبات هيئة الزكاة والضريبة والجمارك.</p>
        </div>
        <a class="btn btn-secondary" href="invoices.html">كل الفواتير</a>
      </div>
      <div class="card">
        <div class="header">
          <h1>STRADIX Company LLC</h1>
          <span class="vat">VAT: 314294141600003</span>
          <small>شركة إس تراديكس</small>
        </div>



    <div class="hint">بورتال تراديكس لإنشاء الفواتير الضريبية وفق متطلبات ZATAC.</div>

    <label for="seller">اسم البائع</label>
    <input id="seller" type="text" value="STRADIX Company LLC شركة إس تراديكس" readonly>

    <label for="vat">الرقم الضريبي للبائع</label>
    <input id="vat" type="text" value="314294141600003" readonly>

    <label for="ts">تاريخ ووقت الفاتورة</label>
    <div class="row subcalc">
      <input id="ts" type="text" placeholder="مثال: 2025-09-18T12:30:00+03:00">
      <button class="btn btn-secondary" onclick="fillNowLocal()">الآن بتوقيت جهازك</button>
    </div>

<label for="invoiceDigits">رقم الفاتورة</label>
<div class="inv-number">
      <span class="inv-prefix" aria-hidden="true">INV-</span>
      <input id="invoiceDigits" class="input" type="text" maxlength="6" placeholder="100123"
            
           oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    </div>


    <label for="subtotal">القيمة قبل الضريبة</label>
    <div class="row subcalc">
      <input id="subtotal" type="text" placeholder="100.00">
      <button class="btn btn-primary" onclick="calcVAT()">احتساب الضريبة</button>
    </div>

    <div class="row two">
      <div>
        <label for="vatamt">مبلغ الضريبة (15%)</label>
        <input id="vatamt" type="text" readonly>
      </div>
      <div>
        <label for="total">إجمالي الفاتورة شامل الضريبة</label>
        <input id="total" type="text" readonly>
      </div>
    </div>

<div class="btns">
  <button class="btn btn-primary" onclick="generate()">توليد QR</button>
  <button class="btn btn-secondary" onclick="clearAll()">مسح الحقول</button>

<!-- 🔵 زر عرض الفاتورة -->
<button id="viewInvoiceBtn" class="action-button" style="display: none;" onclick="window.location.href='invoice-view.html'">
  👁️ عرض الفاتورة
</button>

  <button id="download" class="btn btn-primary" style="display:none;" onclick="downloadQR()">تحميل QR</button>
<button id="saveButton" class="btn btn-primary" style="display:none;" onclick="saveInvoiceToStorage()">💾 حفظ الفاتورة</button>
<span id="saveStatus" class="save-status"></span>

</div>


    <div class="status" id="status"></div>

    <div class="out" id="out">
      <div>
        <label for="b64">نص Base64</label>
        <textarea id="b64" readonly></textarea>
        <div class="btns" style="margin-top:8px;">
          <button class="btn btn-secondary" type="button" onclick="copyB64()">نسخ Base64</button>
        </div>
      </div>

      <div class="qr-preview">
        <div class="qr-orbit-wrap">
          <div class="qr-orbit o1"><div class="qr-electron"></div></div>
          <div class="qr-orbit o2"><div class="qr-electron"></div></div>
          <div class="qr-orbit o3"><div class="qr-electron"></div></div>
        </div>
        <div id="qrContainer"></div>
      </div>
    </div>

    <footer>⚠️ هذا البورتال خاص بشركة إس تراديكس</footer>
  </div>
</div>

<script>
  function fillNowLocal() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    const y = d.getFullYear(), m = pad(d.getMonth() + 1), day = pad(d.getDate());
    const hh = pad(d.getHours()), mm = pad(d.getMinutes()), ss = pad(d.getSeconds());
    const off = -d.getTimezoneOffset();
    const sign = off >= 0 ? '+' : '-';
    const oh = pad(Math.floor(Math.abs(off) / 60)), om = pad(Math.abs(off) % 60);
    document.getElementById('ts').value = `${y}-${m}-${day}T${hh}:${mm}:${ss}${sign}${oh}:${om}`;
  }

  function parseNumber(val) {
    return parseFloat((val || '').toString().replace(/,/g, '')) || 0;
  }

  function calcVAT() {
    const subtotal = parseNumber(document.getElementById("subtotal").value);
    const vat = subtotal * 0.15, total = subtotal + vat;
    document.getElementById("vatamt").value = vat.toFixed(2);
    document.getElementById("total").value = total.toFixed(2);
  }

function clearAll() {
  ['ts','subtotal','vatamt','total','invoiceDigits','b64'].forEach(id=>{
    const el = document.getElementById(id);
    if (el) el.value = '';
  });

  document.getElementById('qrContainer').innerHTML = '';
  document.getElementById('out').style.display = 'none';
  document.getElementById('status').textContent = '';

  // ✅ إخفاء أزرار التحميل والحفظ
  document.getElementById("download").style.display = 'none';
  document.getElementById("saveButton").style.display = 'none';
    // ✅ إخفاء زر عرض الفاتورة
  document.getElementById("viewInvoiceBtn").style.display = "none";

  // ✅ إعادة زر الحفظ لحالته الطبيعية
  const saveBtn = document.getElementById("saveButton");
  if (saveBtn) {
    saveBtn.textContent = "💾 حفظ الفاتورة";
    saveBtn.classList.remove("btn-success");  // لو كنت مغير لونه
  }
}
  function tlv(tag, value) {
    const enc = new TextEncoder();
    const val = enc.encode(String(value ?? ''));
    if (val.length > 255) throw new Error("قيمة طويلة");
    return Uint8Array.from([tag, val.length, ...val]);
  }

</script>

<script>
  let qrGenerated = false;
  let currentCanvas = null;

  function generate() {
    const seller = document.getElementById("seller").value.trim();
    const vat = document.getElementById("vat").value.trim();
    const ts = document.getElementById("ts").value.trim();
    const total = document.getElementById("total").value.trim();
    const vatamt = document.getElementById("vatamt").value.trim();
    const invoiceDigits = document.getElementById("invoiceDigits").value.trim();

    if (!/^[0-9]{6}$/.test(invoiceDigits)) {
      showStatus("⚠️ رقم الفاتورة يجب أن يكون 6 أرقام", false);
      return;
    }
    

    try {
      const tlvData = new Uint8Array([
        ...tlv(1, seller),
        ...tlv(2, vat),
        ...tlv(3, ts),
        ...tlv(4, Number(total).toFixed(2)),
        ...tlv(5, Number(vatamt).toFixed(2))
      ]);

      const b64 = btoa(String.fromCharCode(...tlvData));
      document.getElementById("b64").value = b64;

      const cont = document.getElementById("qrContainer");
      cont.innerHTML = '';
      const qr = new QRCode(cont, {
        text: b64,
        width: 200,
        height: 200,
        correctLevel: QRCode.CorrectLevel.M,
        margin: 0
      });

      setTimeout(() => {
  currentCanvas = cont.querySelector('canvas');
  const dl = document.getElementById("download");
  if (currentCanvas && dl) {
    dl.style.display = 'inline-block';
  }
}, 200);
;

      // ✅ Show result section + save button
      document.getElementById('out').style.display = 'grid';
      document.getElementById("saveButton").style.display = 'inline-block';
      document.getElementById("saveStatus").textContent = "";
      qrGenerated = true;
  // ✅ إظهار زر عرض الفاتورة
  document.getElementById("viewInvoiceBtn").style.display = "inline-block";

      showStatus("✔ تم توليد QR", true);
currentCanvas = document.querySelector("#qrContainer canvas");

    } catch (e) {
      showStatus("❌ خطأ: " + e.message, false);
    }
  }

  function saveInvoiceToStorage() {
    const saveBtn = document.getElementById("saveButton");
    const statusEl = document.getElementById("saveStatus");

    if (!qrGenerated) {
      statusEl.textContent = "⚠️ برجاء توليد الـ QR أولاً ثم الحفظ";
      statusEl.style.color = "#ef4444";
      return;
    }

    // ✅ الحفظ الفعلي
    // تقدر هنا تحفظ البيانات في LocalStorage أو ترسلها لسيرفر
    // مثال:
    // localStorage.setItem("invoiceData", JSON.stringify(invoice));

    saveBtn.style.backgroundColor = "#10B981"; // أخضر
    saveBtn.textContent = "✔ تم الحفظ";
    statusEl.textContent = "";
  }

  

function downloadQR() {
  const invoiceDigits = document.getElementById("invoiceDigits").value.trim();

  if (!/^[0-9]{6}$/.test(invoiceDigits)) {
    showStatus("⚠️ رقم الفاتورة يجب أن يكون 6 أرقام", false);
    return;
  }

  const canvas = document.querySelector("#qrContainer canvas");
  if (!canvas) {
    showStatus("❌ لا يوجد QR لتحميله", false);
    return;
  }

  const a = document.createElement('a');
  a.download = `INV-${invoiceDigits}_zatca_qr.png`;
  a.href = canvas.toDataURL("image/png");
  a.click();
}

    
</script>

<!-- سايد بار -->

<script>
  function saveInvoice() {
    const invoice = {
      number: document.getElementById("invoiceNumber").value,
      clientName: document.getElementById("clientName").value,
      vatNumber: document.getElementById("vatNumber").value,
      date: document.getElementById("invoiceDate").value,
      items: [
        {
          name: document.getElementById("itemName").value,
          price: parseFloat(document.getElementById("itemPrice").value || 0),
          qty: parseInt(document.getElementById("itemQty").value || 1)
        }
      ]
    };

    localStorage.setItem("currentInvoice", JSON.stringify(invoice));
    window.location.href = "invoice-view.html";
  }
</script>
